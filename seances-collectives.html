  <!-- ═══════════════════════════════════════════════════════════════════
       CETTE PAGE N'EST PLUS LA PAGE DES SÉANCES. NE PAS LA SUPPRIMER.

       Le 11 septembre 2026, « seances-collectives.html » est devenue
       « courir-en-groupe.html ». Ce fichier reste à l'ancienne adresse et
       n'a qu'un rôle : renvoyer vers la nouvelle.

       Sans lui, tous les liens déjà diffusés — messages, réseaux sociaux,
       résultats Google, favoris — tomberaient sur une page d'erreur.

       Le site est servi par GitHub Pages, qui ne sait pas rediriger
       côté serveur : pas de .htaccess, pas de règle de redirection. La
       balise « refresh » ci-dessous est donc le seul moyen disponible, et
       c'est celui que Google reconnaît comme un déménagement dès lors que
       le délai vaut 0 et que la balise « canonical » désigne la nouvelle
       adresse.
       ═══════════════════════════════════════════════════════════════════ -->
